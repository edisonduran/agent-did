# Dependabot configuration.
# - The EVM profile (contracts and adapters) lives in edisonduran/agent-did-evm.
# - Major bumps of crypto/encoding deps and TypeScript are applied manually (wire/parity impact).
# - didwebvh-ts is pinned to an exact version in sdk/package.json and gets its own PR: it decides the bytes of
#   the did:webvh logs the SDK writes, so every release is reviewed against the Python SDK and the shared vectors.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "didwebvh-ts"
    ignore:
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@noble/hashes"
        update-types: ["version-update:semver-major"]
      - dependency-name: "multiformats"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/integrations/langchain"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/sdk-python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/integrations/a2a"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/integrations/crewai"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/integrations/langchain-python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/integrations/microsoft-agent-framework"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/integrations/semantic-kernel"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns:
          - "*"
