name: CI — Cross-SDK Interop Evidence

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-cross-sdk-interop.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'sdk-python/**'
  pull_request:
    paths:
      - '.github/workflows/ci-cross-sdk-interop.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'sdk-python/**'
  workflow_dispatch:

concurrency:
  group: interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-interop:
    name: TypeScript shared-fixture interop
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Run TypeScript interop evidence path
        run: npm run interop:ts

  python-interop:
    name: Python shared-fixture interop
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python interop evidence path
        run: python -m pytest sdk-python/tests/test_interop_vectors.py -q