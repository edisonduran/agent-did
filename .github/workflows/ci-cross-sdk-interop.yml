name: CI — Cross-SDK Interop Evidence

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-cross-sdk-interop.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'sdk-python/**'
  pull_request:
    paths:
      - '.github/workflows/ci-cross-sdk-interop.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'sdk-python/**'
  workflow_dispatch:
  # Daily run on main keeps the C-QA-8 green window evidence-based.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript-interop:
    name: TypeScript shared-fixture interop
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Run TypeScript interop evidence path
        run: npm run interop:ts

  python-interop:
    name: Python shared-fixture interop
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python interop evidence path
        run: python -m pytest sdk-python/tests/test_interop_vectors.py -q

  live-roundtrip:
    name: Live TS <-> Python round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix sdk ci
          npm --prefix sdk run build
          python -m pip install --upgrade pip
          pip install -e "sdk-python[dev]"

      - name: Each SDK signs, the other verifies
        run: npm run interop:cross-sdk
