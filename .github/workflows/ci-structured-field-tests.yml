name: CI — Structured Field Tests

# Runs the httpwg/structured-field-tests (RFC 8941) dictionary cases, pinned in
# fixtures/structured-field-tests.json, through the Signature-Input and
# Signature parsers of both SDKs (External Conformance Matrix, M-12).

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-structured-field-tests.yml'
      - 'fixtures/structured-field-tests.json'
      - 'sdk/src/core/http-signatures.ts'
      - 'sdk/tests/StructuredFieldTests.test.ts'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/agent_did_sdk/core/http_signatures.py'
      - 'sdk-python/tests/test_structured_field_tests.py'
      - 'sdk-python/pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/ci-structured-field-tests.yml'
      - 'fixtures/structured-field-tests.json'
      - 'sdk/src/core/http-signatures.ts'
      - 'sdk/tests/StructuredFieldTests.test.ts'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/agent_did_sdk/core/http_signatures.py'
      - 'sdk-python/tests/test_structured_field_tests.py'
      - 'sdk-python/pyproject.toml'
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * *'

concurrency:
  group: sft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript parsers vs structured-field-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned suite commit
        id: suite
        run: echo "commit=$(jq -r .commit fixtures/structured-field-tests.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout structured-field-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: httpwg/structured-field-tests
          ref: ${{ steps.suite.outputs.commit }}
          path: structured-field-tests
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Run the suite
        env:
          STRUCTURED_FIELD_TESTS_DIR: ${{ github.workspace }}/structured-field-tests
        run: npm --prefix sdk test -- --runInBand StructuredFieldTests.test.ts

  python:
    name: Python parsers vs structured-field-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned suite commit
        id: suite
        run: echo "commit=$(jq -r .commit fixtures/structured-field-tests.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout structured-field-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: httpwg/structured-field-tests
          ref: ${{ steps.suite.outputs.commit }}
          path: structured-field-tests
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        env:
          STRUCTURED_FIELD_TESTS_DIR: ${{ github.workspace }}/structured-field-tests
        run: python -m pytest sdk-python/tests/test_structured_field_tests.py -q
