name: CI — W3C vc-di-eddsa Vectors

# Runs the W3C vc-di-eddsa `eddsa-jcs-2022` test vectors, pinned in
# fixtures/vc-di-eddsa-test-vectors.json, through both SDKs' Data Integrity
# implementation (ADR-006 D-8d, AgentMetadataCredential, RFC-001 §4.4).

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-vc-di-eddsa-vectors.yml'
      - 'fixtures/vc-di-eddsa-test-vectors.json'
      - 'sdk/src/crypto/**'
      - 'sdk/tests/VcDiEddsaTestVectors.test.ts'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/agent_did_sdk/crypto/**'
      - 'sdk-python/tests/test_vc_di_eddsa_vectors.py'
      - 'sdk-python/pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/ci-vc-di-eddsa-vectors.yml'
      - 'fixtures/vc-di-eddsa-test-vectors.json'
      - 'sdk/src/crypto/**'
      - 'sdk/tests/VcDiEddsaTestVectors.test.ts'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/agent_did_sdk/crypto/**'
      - 'sdk-python/tests/test_vc_di_eddsa_vectors.py'
      - 'sdk-python/pyproject.toml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: vc-di-eddsa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript SDK vs vc-di-eddsa vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned vectors commit
        id: vectors
        run: echo "commit=$(jq -r .commit fixtures/vc-di-eddsa-test-vectors.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout vc-di-eddsa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: w3c/vc-di-eddsa
          ref: ${{ steps.vectors.outputs.commit }}
          path: vc-di-eddsa
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Run the vectors
        env:
          VC_DI_EDDSA_DIR: ${{ github.workspace }}/vc-di-eddsa
        run: |
          # The tests skip without the checkout: fail instead if it is missing
          test -f "$VC_DI_EDDSA_DIR/TestVectors/eddsa-jcs-2022/signedJCS.json"
          npm --prefix sdk test -- --runInBand VcDiEddsaTestVectors.test.ts

  python:
    name: Python SDK vs vc-di-eddsa vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned vectors commit
        id: vectors
        run: echo "commit=$(jq -r .commit fixtures/vc-di-eddsa-test-vectors.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout vc-di-eddsa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: w3c/vc-di-eddsa
          ref: ${{ steps.vectors.outputs.commit }}
          path: vc-di-eddsa
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the vectors
        env:
          VC_DI_EDDSA_DIR: ${{ github.workspace }}/vc-di-eddsa
        run: |
          # The tests skip without the checkout: fail instead if it is missing
          test -f "$VC_DI_EDDSA_DIR/TestVectors/eddsa-jcs-2022/signedJCS.json"
          python -m pytest sdk-python/tests/test_vc_di_eddsa_vectors.py -q
