name: Contract Audit

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'contracts/**'
      - 'scripts/contract-audit.js'
      - '.github/workflows/contract-audit.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'contracts/**'
      - 'scripts/contract-audit.js'
      - '.github/workflows/contract-audit.yml'
      - 'package.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-contract:
    name: Slither and Mythril
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Hardhat 2.22 supports Node up to 22.
          node-version: 22

      - name: Run contract audit
        env:
          AUDIT_FAIL_ON_SEVERITY: low
        run: npm run audit:contracts

      - name: Upload audit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-audit-reports
          path: contracts/reports/security
          if-no-files-found: error