name: CI — did:webvh Test Suite

# Runs the DIF didwebvh-test-suite vectors, pinned in
# fixtures/didwebvh-test-suite.json, through both SDK adapters (ADR-002,
# condition 6; release criterion C-EXT-1).

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-didwebvh-test-suite.yml'
      - 'fixtures/didwebvh-test-suite.json'
      - 'sdk/src/webvh/**'
      - 'sdk/tests/WebvhTestSuite.test.ts'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/agent_did_sdk/webvh/**'
      - 'sdk-python/tests/test_webvh_test_suite.py'
      - 'sdk-python/pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/ci-didwebvh-test-suite.yml'
      - 'fixtures/didwebvh-test-suite.json'
      - 'sdk/src/webvh/**'
      - 'sdk/tests/WebvhTestSuite.test.ts'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/agent_did_sdk/webvh/**'
      - 'sdk-python/tests/test_webvh_test_suite.py'
      - 'sdk-python/pyproject.toml'
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * *'

concurrency:
  group: didwebvh-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript adapter vs didwebvh-test-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned suite commit
        id: suite
        run: echo "commit=$(jq -r .commit fixtures/didwebvh-test-suite.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout didwebvh-test-suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: decentralized-identity/didwebvh-test-suite
          ref: ${{ steps.suite.outputs.commit }}
          path: didwebvh-test-suite
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Run the suite
        env:
          DIDWEBVH_TEST_SUITE_DIR: ${{ github.workspace }}/didwebvh-test-suite
        run: npm --prefix sdk test -- --runInBand WebvhTestSuite.test.ts

  python:
    name: Python adapter vs didwebvh-test-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned suite commit
        id: suite
        run: echo "commit=$(jq -r .commit fixtures/didwebvh-test-suite.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout didwebvh-test-suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: decentralized-identity/didwebvh-test-suite
          ref: ${{ steps.suite.outputs.commit }}
          path: didwebvh-test-suite
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the suite
        env:
          DIDWEBVH_TEST_SUITE_DIR: ${{ github.workspace }}/didwebvh-test-suite
        run: python -m pytest sdk-python/tests/test_webvh_test_suite.py -q
