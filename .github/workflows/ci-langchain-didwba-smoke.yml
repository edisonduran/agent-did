name: CI — LangChain did:wba Demo Smoke

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/ci-langchain-didwba-smoke.yml"
      - "package.json"
      - "scripts/langchain-didwba-demo-smoke.mjs"
      - "sdk/**"
      - "sdk-python/**"
      - "integrations/langchain/**"
      - "integrations/langchain-python/**"
  pull_request:
    paths:
      - ".github/workflows/ci-langchain-didwba-smoke.yml"
      - "package.json"
      - "scripts/langchain-didwba-demo-smoke.mjs"
      - "sdk/**"
      - "sdk-python/**"
      - "integrations/langchain/**"
      - "integrations/langchain-python/**"
  workflow_dispatch:
  # Daily run on main keeps the C-QA-8 green window evidence-based.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-langchain-didwba-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  didwba-demo-smoke:
    name: Node 24 + Python 3.12 - LangChain did:wba Demo Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/langchain/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Install LangChain JS integration dependencies
        run: npm --prefix integrations/langchain ci

      - name: Build TypeScript SDK
        run: npm --prefix sdk run build

      - name: Install Python SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install LangChain Python integration in dev mode
        working-directory: integrations/langchain-python
        run: python -m pip install -e ".[dev]"

      - name: Run cross-package did:wba demo smoke
        run: npm run smoke:langchain-didwba