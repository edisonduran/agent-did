name: CI — JSON-LD Context

# Checks that the published Agent-DID JSON-LD context (contexts/v1.jsonld, M-19) defines every
# term the documents use, by expanding them in JSON-LD safe mode, and that the pinned context
# was not edited in place.

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-jsonld-context.yml'
      - 'contexts/**'
      - 'fixtures/jsonld-context-documents.json'
      - 'fixtures/webvh-log-vectors.json'
      - 'scripts/check-jsonld-context.js'
      - 'sdk/src/webvh/documents.ts'
      - 'sdk-python/src/agent_did_sdk/webvh/documents.py'
      - 'sdk-python/tests/test_jsonld_context.py'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/ci-jsonld-context.yml'
      - 'contexts/**'
      - 'fixtures/jsonld-context-documents.json'
      - 'fixtures/webvh-log-vectors.json'
      - 'scripts/check-jsonld-context.js'
      - 'sdk/src/webvh/documents.ts'
      - 'sdk-python/src/agent_did_sdk/webvh/documents.py'
      - 'sdk-python/tests/test_jsonld_context.py'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: jsonld-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context:
    name: Context defines every document term
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Expand documents in safe mode
        run: npm run check:jsonld-context

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Python SDK uses only defined terms
        run: |
          python -m pip install -e "sdk-python[dev]"
          python -m pytest sdk-python/tests/test_jsonld_context.py -q
