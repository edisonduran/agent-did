name: CI EVM adapter

on:
  push:
    branches: [main]
    paths: ['evm/**', '.github/workflows/ci-evm.yml']
  pull_request:
    paths: ['evm/**', '.github/workflows/ci-evm.yml']

permissions:
  contents: read

jobs:
  evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evm/package-lock.json
      - run: npm --prefix evm ci
      - run: npm --prefix evm run build
      - run: npm --prefix evm test
      - run: node scripts/check-npm-package-manifest.js evm
