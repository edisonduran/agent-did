name: CI EVM adapter

on:
  push:
    branches: [main]
    paths: ['evm/**', '.github/workflows/ci-evm.yml']
  pull_request:
    paths: ['evm/**', '.github/workflows/ci-evm.yml']

permissions:
  contents: read

jobs:
  evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: evm/package-lock.json
      - run: npm --prefix evm ci
      - run: npm --prefix evm run build
      - run: npm --prefix evm test
      - run: node scripts/check-npm-package-manifest.js evm
