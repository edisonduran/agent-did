name: Resolver HA Drill

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolver-ha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-ha-drill:
    name: TypeScript resolver HA drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Build TypeScript SDK
        run: npm --prefix sdk run build

      - name: Run TypeScript HA smoke
        run: npm run smoke:ha

      - name: Record runbook reference
        run: |
          echo 'Validated against docs/RFC-001-Resolver-HA-Runbook.md' >> "$GITHUB_STEP_SUMMARY"

  python-ha-drill:
    name: Python resolver HA drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python HA smoke
        working-directory: sdk-python
        run: python scripts/resolver_ha_smoke.py

      - name: Record runbook reference
        run: |
          echo 'Validated against docs/RFC-001-Resolver-HA-Runbook.md' >> "$GITHUB_STEP_SUMMARY"