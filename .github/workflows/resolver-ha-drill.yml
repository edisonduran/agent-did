name: Resolver HA Drill

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolver-ha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-ha-drill:
    name: TypeScript resolver HA drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Build TypeScript SDK
        run: npm --prefix sdk run build

      - name: Run TypeScript HA smoke
        run: npm run smoke:ha

      - name: Record runbook reference
        run: |
          echo 'Validated against docs/RFC-001-Resolver-HA-Runbook.md' >> "$GITHUB_STEP_SUMMARY"

  python-ha-drill:
    name: Python resolver HA drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python HA smoke
        working-directory: sdk-python
        run: python scripts/resolver_ha_smoke.py

      - name: Record runbook reference
        run: |
          echo 'Validated against docs/RFC-001-Resolver-HA-Runbook.md' >> "$GITHUB_STEP_SUMMARY"