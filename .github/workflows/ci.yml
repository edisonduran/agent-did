name: CI — TypeScript SDK & RFC-001 Conformance

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'contracts/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'contracts/**'
      - 'scripts/**'
  workflow_dispatch:
  # Daily run on main keeps the C-QA-8 green window evidence-based.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 - Build, Test & RFC-001 Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
            contracts/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Check TypeScript public API snapshot
        run: npm --prefix sdk run api:check

      - name: Check TypeScript public API signature snapshot
        run: npm --prefix sdk run api:signature:check

      - name: Install contract dependencies
        run: npm --prefix contracts ci

      - name: Run TypeScript SDK tests with coverage gate
        run: npm --prefix sdk test -- --coverage --runInBand

      - name: Build TypeScript SDK
        run: npm --prefix sdk run build

      - name: Check packed npm manifest has registry-only runtime dependencies
        run: node scripts/check-npm-package-manifest.js sdk

      - name: Run RFC-001 conformance suite
        run: npm run conformance:rfc001
