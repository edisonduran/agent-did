name: CI — TypeScript SDK & RFC-001 Conformance

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'contracts/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'fixtures/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/**'
      - 'contracts/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 20 - Build, Test & RFC-001 Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
            contracts/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Check TypeScript public API snapshot
        run: npm --prefix sdk run api:check

      - name: Install contract dependencies
        run: npm --prefix contracts ci

      - name: Run TypeScript SDK tests
        run: npm --prefix sdk test

      - name: Build TypeScript SDK
        run: npm --prefix sdk run build

      - name: Run RFC-001 conformance suite
        run: npm run conformance:rfc001
