name: CI — Python SDK & RFC-001 Conformance

on:
  push:
    branches:
      - master
      - main
    paths:
      - "fixtures/**"
      - "sdk-python/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    paths:
      - "fixtures/**"
      - "sdk-python/**"
      - ".github/workflows/ci-python.yml"
  workflow_dispatch:
  # Daily run on main keeps the C-QA-8 green window evidence-based.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-sdk:
    name: Python ${{ matrix.python-version }} - Lint, Type-check, Build, Test & RFC-001 Conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Python public API snapshot
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: python scripts/public_api_snapshot.py --check

      - name: Check Python public API signature snapshot
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: python scripts/public_api_signature_snapshot.py --check

      - name: Lint with ruff
        working-directory: sdk-python
        run: ruff check src/ tests/ scripts/ examples/

      - name: Type check with mypy
        working-directory: sdk-python
        run: mypy --strict src/

      - name: Run tests with coverage
        working-directory: sdk-python
        run: pytest --cov=agent_did_sdk --cov-fail-under=85 -q

      - name: Build package
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: |
          pip install build
          python -m build

      - name: Run RFC-001 Python conformance
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: python scripts/conformance_rfc001.py

      - name: Run Python RPC smoke
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: python scripts/rpc_resolver_smoke.py

      - name: Run Python HA smoke
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: python scripts/resolver_ha_smoke.py

      - name: Run Python revocation policy smoke
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: python scripts/revocation_policy_smoke.py

      - name: Run Python E2E smoke
        if: matrix.python-version == '3.12'
        working-directory: sdk-python
        run: python scripts/e2e_smoke.py
