name: Publish TypeScript SDK to npm

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build TypeScript SDK package
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Verify tag matches sdk version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        working-directory: sdk
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match sdk/package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Check TypeScript public API snapshot
        run: npm --prefix sdk run api:check

      - name: Check TypeScript public API signature snapshot
        run: npm --prefix sdk run api:signature:check

      - name: Run TypeScript SDK tests with coverage gate
        run: npm --prefix sdk test -- --coverage --runInBand

      - name: Build TypeScript SDK
        run: npm --prefix sdk run build

      - name: Pack TypeScript SDK tarball
        working-directory: sdk
        run: npm pack

      - name: Check packed manifest has registry-only runtime dependencies
        run: node scripts/check-npm-package-manifest.js sdk/*.tgz

      - name: Upload TypeScript SDK tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-sdk-tarball
          path: sdk/*.tgz
          if-no-files-found: error

  publish-npm:
    name: Publish TypeScript SDK to npm
    if: startsWith(github.ref, 'refs/tags/sdk-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download TypeScript SDK tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-sdk-tarball
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish TypeScript SDK to npm with provenance
        run: npm publish ./dist/*.tgz --access public --provenance