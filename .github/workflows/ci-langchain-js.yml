name: CI — LangChain JS Integration

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-langchain-js.yml'
      - 'package.json'
      - 'sdk/**'
      - 'integrations/langchain/**'
      - 'scripts/check-npm-package-manifest.js'
  pull_request:
    paths:
      - '.github/workflows/ci-langchain-js.yml'
      - 'package.json'
      - 'sdk/**'
      - 'integrations/langchain/**'
      - 'scripts/check-npm-package-manifest.js'
  workflow_dispatch:
  # Daily run on main keeps the C-QA-8 green window evidence-based.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-langchain-js-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  langchain-js:
    name: Node 24 - Build SDK & Test LangChain JS Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/langchain/package-lock.json

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Install LangChain integration dependencies
        run: npm --prefix integrations/langchain ci

      - name: Build TypeScript SDK
        run: npm --prefix sdk run build

      - name: Run LangChain integration tests
        run: npm run test:langchain

      - name: Check packed npm manifest has registry-only runtime dependencies
        run: node scripts/check-npm-package-manifest.js integrations/langchain