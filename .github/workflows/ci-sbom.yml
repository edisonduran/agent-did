name: CI — CycloneDX SBOM

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-sbom.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/pyproject.toml'
      - 'integrations/**/package.json'
      - 'integrations/**/package-lock.json'
      - 'integrations/**/pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/ci-sbom.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/pyproject.toml'
      - 'integrations/**/package.json'
      - 'integrations/**/package-lock.json'
      - 'integrations/**/pyproject.toml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag (e.g. v1.0.0-rc.5) to build SBOMs from and attach them to; empty only uploads workflow artifacts"
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build SBOMs from and attach them to; empty only uploads workflow artifacts"
        required: false
        default: ''
        type: string

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-sbom:
    name: NPM SBOM — ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-path: sdk
            artifact-name: agentdid-sdk
          - package-path: integrations/langchain
            artifact-name: agentdid-langchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on push/PR runs, so the triggering ref is checked out.
          ref: ${{ inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install npm package dependencies
        working-directory: ${{ matrix.package-path }}
        run: npm ci

      - name: Generate npm CycloneDX SBOM
        working-directory: ${{ matrix.package-path }}
        run: |
          npm exec --yes @cyclonedx/cyclonedx-npm@4.2.1 -- \
            --ignore-npm-errors \
            --output-reproducible \
            --output-format JSON \
            --output-file "$RUNNER_TEMP/${{ matrix.artifact-name }}.cdx.json"

      - name: Upload npm SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.artifact-name }}
          path: ${{ runner.temp }}/${{ matrix.artifact-name }}.cdx.json
          if-no-files-found: error

  python-sbom:
    name: Python SBOM — ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package-path: sdk-python
            artifact-name: agent-did-sdk
          - package-path: integrations/langchain-python
            artifact-name: agent-did-langchain
          - package-path: integrations/crewai
            artifact-name: agent-did-crewai
          - package-path: integrations/semantic-kernel
            artifact-name: agent-did-semantic-kernel
          - package-path: integrations/microsoft-agent-framework
            artifact-name: agent-did-microsoft-agent-framework
          - package-path: integrations/a2a
            artifact-name: agent-did-a2a
          - package-path: integrations/mcp
            artifact-name: agent-did-mcp

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on push/PR runs, so the triggering ref is checked out.
          ref: ${{ inputs.release_tag }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install CycloneDX CLI
        run: python -m pip install --upgrade pip cyclonedx-bom

      - name: Generate Python CycloneDX SBOM
        env:
          PACKAGE_PATH: ${{ matrix.package-path }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}
        run: |
          venv_dir="$RUNNER_TEMP/${ARTIFACT_NAME}-venv"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --upgrade pip
          if [ "$PACKAGE_PATH" != "sdk-python" ]; then
            "$venv_dir/bin/python" -m pip install -e ./sdk-python
          fi
          "$venv_dir/bin/python" -m pip install -e "./$PACKAGE_PATH"
          python -m cyclonedx_py environment "$venv_dir" \
            --pyproject "./$PACKAGE_PATH/pyproject.toml" \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file "$RUNNER_TEMP/${ARTIFACT_NAME}.cdx.json"

      - name: Upload Python SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.artifact-name }}
          path: ${{ runner.temp }}/${{ matrix.artifact-name }}.cdx.json
          if-no-files-found: error

  attach-to-release:
    name: Attach SBOMs to GitHub Release
    if: inputs.release_tag != ''
    needs:
      - npm-sbom
      - python-sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true

      - name: Attach SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Passed as data, never interpolated into the script
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          count=$(find sbom -maxdepth 1 -name '*.cdx.json' | wc -l)
          if [ "$count" -ne 9 ]; then
            echo "Expected 9 SBOMs (2 npm + 7 Python), found $count" >&2
            ls -l sbom >&2
            exit 1
          fi

          # The tag push starts this run before the maintainer writes the release notes,
          # so a missing release is created as a draft for the maintainer to complete.
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}"               --title "$RELEASE_TAG"               --notes "Draft created by the SBOM job; see CHANGELOG.md for release notes."
          fi

          gh release upload "$RELEASE_TAG" sbom/*.cdx.json --clobber
