name: CI — Fuzz

# Property tests / fuzzing of the input parsers (Structured Fields, did.jsonl,
# publicKeyMultibase) with fast-check and hypothesis (M-14). Pull requests run
# the small default budget as part of the normal suites; this workflow runs a
# much larger budget nightly and on demand.

on:
  pull_request:
    paths:
      - '.github/workflows/ci-fuzz.yml'
      - 'sdk/tests/Fuzz.property.test.ts'
      - 'sdk-python/tests/test_fuzz_properties.py'
  workflow_dispatch:
    inputs:
      runs:
        description: 'fast-check runs per property'
        default: '5000'
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: fast-check (TypeScript parsers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm --prefix sdk ci

      - name: Run property tests
        env:
          FUZZ_RUNS: ${{ github.event_name == 'pull_request' && '300' || inputs.runs || '5000' }}
        run: npm --prefix sdk test -- --runInBand Fuzz.property.test.ts

  python:
    name: hypothesis (Python parsers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install SDK in dev mode
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run property tests
        env:
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'pull_request' && 'default' || 'nightly' }}
        run: python -m pytest sdk-python/tests/test_fuzz_properties.py -q
