name: CI — Third-party did:webvh Resolver

# Logs written by AgentIdentity (both SDKs) are served over HTTPS and resolved by the DIF Universal Resolver
# did:webvh driver, run from its published image pinned in fixtures/third-party-resolver.json (M-17, C-EXT-1).

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/ci-third-party-resolver.yml'
      - 'fixtures/third-party-resolver.json'
      - 'scripts/third-party-resolver/**'
      - 'sdk/src/**'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/**'
      - 'sdk-python/scripts/emit_webvh_logs.py'
      - 'sdk-python/pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/ci-third-party-resolver.yml'
      - 'fixtures/third-party-resolver.json'
      - 'scripts/third-party-resolver/**'
      - 'sdk/src/**'
      - 'sdk/package.json'
      - 'sdk/package-lock.json'
      - 'sdk-python/src/**'
      - 'sdk-python/scripts/emit_webvh_logs.py'
      - 'sdk-python/pyproject.toml'
  workflow_dispatch:
  schedule:
    - cron: '53 6 * * *'

concurrency:
  group: third-party-resolver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  universal-resolver-driver:
    name: DIF did:webvh driver resolves our logs
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix sdk ci
          npm --prefix sdk run build
          python -m pip install --upgrade pip
          pip install -e "sdk-python[dev]"

      - name: Resolve our logs with the third-party driver
        run: npm run interop:third-party-resolver
