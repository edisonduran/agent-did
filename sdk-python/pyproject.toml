[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-did-sdk"
version = "1.0.0rc4"
description = "Python SDK for the Agent-DID Specification (RFC-001) — create, sign, resolve, verify and revoke Agent-DIDs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Agent-DID contributors" },
]
keywords = ["did", "agent", "identity", "decentralized", "web3", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]

dependencies = [
  "pydantic>=2.0",
  "pynacl>=1.5",
  "httpx>=0.27",
  "rfc8785>=0.1.4,<0.2",
  # RFC 8941 Structured Fields parser for Signature-Input / Signature
  "http-sf>=1.5,<2",
  # did:webvh v1.0 reference implementation (ADR-002). Pulls aries-askar, which
  # has no musllinux or Windows ARM64 wheels; see README "Platform support".
  "did-webvh>=1.0.1,<1.1",
]

[project.optional-dependencies]
# Optional EVM registry adapter (agent_did_sdk.evm); the core never imports it.
evm = [
  "web3>=6.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # Property tests / fuzzing of the parsers (tests/test_fuzz_properties.py)
  "hypothesis>=6.100",
  "ruff>=0.4",
  "mypy>=1.10",
  # Independent RFC 9421 implementation, used only to cross-check HTTP signatures in tests.
  "http-message-signatures==3.0.0",
  "requests>=2.31",
  # Smokes and tests of the optional EVM adapter (agent_did_sdk.evm)
  "web3>=6.0",
]

[project.urls]
Homepage = "https://github.com/edisonduran/agent-did#readme"
Repository = "https://github.com/edisonduran/agent-did.git"
Bug-Tracker = "https://github.com/edisonduran/agent-did/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# did-webvh and its JCS dependency ship without type information.
module = ["did_webvh", "did_webvh.*", "jsoncanon"]
ignore_missing_imports = true
